name: nuthatch check

on:
  push:
    paths:
      - "nest/**"
      - ".github/workflows/nuthatch-check.yml"
  pull_request:
    paths:
      - "nest/**"
      - ".github/workflows/nuthatch-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install nuthatch
        run: |
          curl -fsSL https://github.com/nuthatch-indexer/nuthatch/releases/download/v0.6.1/nuthatch-linux-x86_64 -o nuthatch
          chmod +x nuthatch
          echo "SHA256: $(sha256sum nuthatch)"
          # Pin the expected checksum from CT 104
          EXPECTED="cac413574b1a7c5536c65403abacc0ae9ce699f2580ae01773e28bb2f0d65e89"
          ACTUAL=$(sha256sum nuthatch | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Checksum mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          sudo mv nuthatch /usr/local/bin/nuthatch

      - name: run nuthatch check
        run: nuthatch check --dir nest

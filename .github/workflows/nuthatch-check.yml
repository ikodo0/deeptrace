name: nuthatch check

on:
  push:
    paths:
      - "nest/**"
      - ".github/workflows/nuthatch-check.yml"
  pull_request:
    paths:
      - "nest/**"
      - ".github/workflows/nuthatch-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install nuthatch
        run: |
          curl -fsSL https://github.com/nuthatch-indexer/nuthatch/releases/download/v0.6.1/nuthatch-x86_64-unknown-linux-gnu.tar.gz -o nuthatch.tar.gz
          tar xzf nuthatch.tar.gz
          chmod +x nuthatch
          sudo mv nuthatch /usr/local/bin/nuthatch
          nuthatch --version

      - name: run nuthatch check
        run: nuthatch check --dir nest

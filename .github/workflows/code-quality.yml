name: code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: check formatting
        run: npm run format:check

      - name: lint code
        run: npm run lint

      - name: check types
        run: npm run typecheck

      - name: build project
        run: npm run build
